<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bean Blast</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HOME -->
  <div id="home" class="screen">
    <h1>BEAN BLAST</h1>
    <p>Ultimate Obstacle Challenge</p>

    <button id="playBtn">PLAY</button>
    <button id="shopBtn">SHOP</button>
    <button id="customBtn">CUSTOMIZE</button>
    <button id="wheelBtn">LUCKY WHEEL</button>

    <div id="profile">
      <span>⭐ Level <b id="level">1</b></span>
      <span>XP: <b id="xp">0</b></span>
      <span>🪙 <b id="coins">500</b></span>
      <span>👑 <b id="crowns">0</b></span>
    </div>
  </div>


  <!-- GAME -->
  <div id="gameScreen" class="screen hidden">

    <div id="hud">
      <span id="roundText">ROUND 1 / 4</span>
      <span id="mapText">JUNGLE RUN</span>
      <span id="progressText">0%</span>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="controls">
      <button id="leftBtn">◀</button>
      <button id="jumpBtn">JUMP</button>
      <button id="rightBtn">▶</button>
    </div>

    <button id="quitBtn">QUIT</button>
  </div>


  <!-- SHOP -->
  <div id="shopScreen" class="screen hidden">
    <h1>SHOP</h1>
    <p>Spend coins on cool skins!</p>

    <div id="shopItems"></div>

    <button id="shopBackBtn">BACK</button>
  </div>


  <!-- CUSTOMIZE -->
  <div id="customScreen" class="screen hidden">
    <h1>CUSTOMIZE</h1>

    <div id="customItems"></div>

    <button id="customBackBtn">BACK</button>
  </div>


  <!-- WHEEL -->
  <div id="wheelScreen" class="screen hidden">
    <h1>LUCKY WHEEL</h1>

    <div id="wheelResult">🎡</div>

    <button id="spinBtn">SPIN</button>
    <button id="wheelBackBtn">BACK</button>
  </div>


  <!-- RESULT -->
  <div id="resultScreen" class="screen hidden">
    <h1 id="resultTitle">QUALIFIED!</h1>

    <p id="resultMessage"></p>

    <button id="nextRoundBtn">NEXT ROUND</button>
    <button id="resultHomeBtn">HOME</button>
  </div>


  <!-- WINNER -->
  <div id="winnerScreen" class="screen hidden">
    <h1>👑 YOU WIN! 👑</h1>

    <p>Congratulations!</p>
    <p>You earned a crown and XP!</p>

    <button id="winnerAgainBtn">PLAY AGAIN</button>
    <button id="winnerHomeBtn">HOME</button>
  </div>


  <!-- IMPORTANT: game.js MUST be last -->
  <script src="game.js"></script>

</body>
</html>
